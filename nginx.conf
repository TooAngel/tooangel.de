server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # dokku terminates TLS and sets HSTS; send the apex to www
    if ($host = tooangel.de) {
        return 301 https://www.tooangel.de$request_uri;
    }

    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /keys/ {
        default_type text/plain;
    }
}
